version: '3.8'

services:
  soundcloud-bot:
    image: ghcr.io/effree/soundcloud-discord-bot:latest
    container_name: soundcloud-discord-bot
    restart: unless-stopped
    environment:
      - SOUNDCLOUD_CLIENT_ID=your_official_client_id
      - SOUNDCLOUD_CLIENT_SECRET=your_official_client_secret
      - SOUNDCLOUD_REFRESH_TOKEN=your_initial_refresh_token
      - SOUNDCLOUD_USER_ID=your_user_id
      - DISCORD_WEBHOOK_WIPS=https://discord.com/api/webhooks/...
      - DISCORD_WEBHOOK_PUBLISHED=https://discord.com/api/webhooks/...
      - CHECK_INTERVAL_MINUTES=10
    volumes:
      - bot_data:/app/data

volumes:
  bot_data: